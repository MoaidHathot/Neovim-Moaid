# yaml-language-server: $schema=https://raw.githubusercontent.com/MoaidHathot/orchestra/main/schemas/orchestration.schema.json
name: actionview-submit
description: |
  Reusable orchestration for submitting entries to ActionView. Accepts a
  pre-built entry JSON string, validates it deterministically against the
  ActionView schema and its type template with the ActionView CLI, and
  submits it with `add --wait --strict` so the CLI itself fails fast on a
  bad entry instead of writing it to the error queue later.

  Fully deterministic (no LLM steps). Version 1.x routed the whole entry
  through a Prompt step that re-emitted the JSON via orchestra_save_file;
  for real payloads (tens of KB) that alone took longer than the step
  timeout, so every large submission was retried from scratch and then
  killed by the 600s cap. The CLI's `validate` and `add --wait --strict`
  do the same checks (required fields, content-block types, template
  defaults and required blocks) in well under a second.

  Output: `submit-entry` prints the CLI's `add` output; `validate-entry`
  prints the CLI's `{ ok, errors[], warnings[] }` report.
version: 2.0.0
tags: ["utility", "actionview", "reusable", "auto"]

inputs:
  entryJson:
    type: String
    description: |
      The full ActionView entry JSON string to submit. Must conform to the ActionView entry schema (requires at minimum: type, source, title).
    required: true
  template:
    type: String
    description: |
      Optional ActionView template (entry type) name. When provided it selects the template used for validation (`validate --type`), so a mismatch between the entry's `type` and the caller's intent is caught before submission.
    required: false
    default: ""
  groupId:
    type: String
    description: |
      Optional group ID to assign to the entry. When set, overrides any groupId in the entry JSON (`add --group-id`). Useful for callers that want to group entries from the same orchestration run.
    required: false
    default: ""

defaultRetryPolicy:
  maxRetries: 2
  backoffSeconds: 3
  backoffMultiplier: 2.0
  retryOnTimeout: true

# Each step is a single short-lived `dnx ActionView.Cli` invocation. A cold
# dnx start can take a while, so leave headroom, but nothing here should ever
# approach the old 600s budget.
defaultStepTimeoutSeconds: 120
timeoutSeconds: 300

steps:
  - name: validate-entry
    type: Script
    shell: pwsh
    script: |
      # Writes the entry to a per-run temp file (the JSON can be far larger than a
      # command line allows) and validates it with the ActionView CLI. Emits the
      # temp file path on the LAST line of stdout so submit-entry can reuse it;
      # everything before it is the CLI's validation report.
      $ErrorActionPreference = 'Stop'
      $entryJson = $args[0]
      $template  = $args[1]

      if ([string]::IsNullOrWhiteSpace($entryJson)) {
        throw 'entryJson is empty.'
      }

      # Fail early with a readable message if the payload is not even JSON.
      try { $null = $entryJson | ConvertFrom-Json -Depth 64 } catch {
        throw "entryJson is not valid JSON: $($_.Exception.Message)"
      }

      $runId = if ($env:ORCHESTRA_RUN_ID) { $env:ORCHESTRA_RUN_ID } else { [guid]::NewGuid().ToString('N') }
      $entryPath = Join-Path ([System.IO.Path]::GetTempPath()) "actionview-entry-$runId.json"
      [System.IO.File]::WriteAllText($entryPath, $entryJson, [System.Text.UTF8Encoding]::new($false))

      $cliArgs = @('ActionView.Cli', '--yes', '--', 'validate', '--file', $entryPath, '--strict')
      if (-not [string]::IsNullOrWhiteSpace($template)) {
        $cliArgs += @('--type', $template)
      }

      $report = & dnx @cliArgs 2>&1 | Out-String
      $exit = $LASTEXITCODE
      Write-Output $report.TrimEnd()
      if ($exit -ne 0) {
        throw "ActionView validation failed (exit $exit). Entry kept at $entryPath for inspection. Report: $($report.Trim())"
      }
      Write-Output $entryPath
    arguments:
      - "{{param.entryJson}}"
      - "{{param.template}}"

  - name: submit-entry
    type: Script
    dependsOn: [validate-entry]
    shell: pwsh
    script: |
      # Submits the validated entry. `--wait --strict` re-validates synchronously
      # inside the CLI so a bad entry fails this step with a precise report rather
      # than landing in ActionView's errors/ queue. The temp file is removed on
      # success and kept on failure for inspection.
      $ErrorActionPreference = 'Stop'
      $validateOutput = $args[0]
      $groupId        = $args[1]

      $lines = $validateOutput -split "`r?`n" | Where-Object { $_.Trim().Length -gt 0 }
      $entryPath = $lines[-1].Trim()
      if (-not (Test-Path -LiteralPath $entryPath)) {
        throw "Validated entry file not found: '$entryPath'"
      }

      $cliArgs = @('ActionView.Cli', '--yes', '--', 'add', '--file', $entryPath, '--wait', '--strict')
      if (-not [string]::IsNullOrWhiteSpace($groupId)) {
        $cliArgs += @('--group-id', $groupId)
      }

      $output = & dnx @cliArgs 2>&1 | Out-String
      $exit = $LASTEXITCODE
      Write-Output $output.TrimEnd()
      if ($exit -ne 0) {
        throw "ActionView add failed (exit $exit). Entry kept at $entryPath for inspection. Output: $($output.Trim())"
      }
      Remove-Item -LiteralPath $entryPath -Force -ErrorAction SilentlyContinue
    arguments:
      - "{{validate-entry.output}}"
      - "{{param.groupId}}"
