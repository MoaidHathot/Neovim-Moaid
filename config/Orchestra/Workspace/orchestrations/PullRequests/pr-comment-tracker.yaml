name: pr-comment-tracker
description: |
  Discovers active Pull Requests created by me in Azure DevOps and delegates each candidate to pr-comment-dispatcher. The dispatcher owns PowerReview session refresh, Zakira comment-response state checks, unaddressed reviewer comment detection, and invoking pr-comment-responder only when needed. Runs on an hourly schedule.
version: 2.0.0
tags: ["ZTS", "MSFT", "PR", "Comment-Response", "auto"]
defaultModel: claude-opus-4.8

variables:
  authorName: Moaid Hathot
  authorUniqueName: MoaidHathot@microsoft.com
  # Organization / project / repository are NOT declared here. The repository
  # list (and each repo's local clone path) lives outside this repository, in
  # $env:ONEDRIVE/Orchestra/Orchestrations/PullRequests/repos.json, and is read
  # via Shared/scripts/pr-repos.ps1. See that script's header for the schema.
  sharedScriptsDir: "{{orchestration.sourceDirectory}}/../Shared/scripts"

defaultRetryPolicy:
  maxRetries: 3
  backoffSeconds: 5
  backoffMultiplier: 2.0
  retryOnTimeout: true

defaultStepTimeoutSeconds: 1500
# Bounds the WHOLE run; must stay above the dispatch step's timeoutSeconds or
# the step budget is unreachable. Scheduler triggers never overlap, so a long
# run delays the next tick instead of stacking concurrent runs.
timeoutSeconds: 54000

mcps:
  - name: orchestra
    type: remote
    endpoint: "{{server.url}}/mcp/data"

steps:
  - name: fetch-my-prs
    type: Script
    shell: pwsh
    # Hard timeout so a regression fails fast rather than hanging; the work is
    # one repo-ID lookup (cached 30d) plus one PR-list call per repository.
    timeoutSeconds: 120
    script: |
      # Deterministic PR enumeration via az CLI, across every configured repo.
      # Lists active PRs CREATED BY `\{{vars.authorUniqueName}}`. Emits a JSON
      # array -- the same contract the downstream `dispatch-candidates` step
      # consumes (an empty array is fine; the engine's forEach handles zero
      # items gracefully and the noteworthy-activity gate downstream
      # short-circuits ActionView submission when nothing was processed).
      #
      # This deliberately does NOT use `az repos pr list --creator <email>`.
      # That flag makes az resolve the email to an identity descriptor via the
      # SPS `/Identities?searchFilter=General` endpoint, which scans the entire
      # org directory; on the `msazure` org it routinely hangs for minutes and
      # has previously left zombie az processes behind. Listing active PRs by
      # repository ID and filtering `createdBy.uniqueName` client-side involves
      # no directory scan and returns in ~1s per repo. Same approach as
      # pr-auto-reviewer's fetch-assigned-prs.
      $ErrorActionPreference = 'Stop'
      try { Get-Command az -ErrorAction Stop | Out-Null } catch {
        throw "az CLI is not available on PATH; cannot fetch authored PRs."
      }

      . '{{vars.sharedScriptsDir}}/pr-repos.ps1'

      # `az` ships an embedded Python that defaults to cp1252 on Windows and dies
      # with a UnicodeEncodeError if any HTTP response contains non-ASCII.
      $env:PYTHONIOENCODING = 'utf-8'

      function ConvertTo-IsoUtcString {
        param($value)
        if ($null -eq $value) { return "" }
        if ($value -is [datetime]) { return ([datetime]$value).ToUniversalTime().ToString("o") }
        if ($value -is [datetimeoffset]) { return ([datetimeoffset]$value).UtcDateTime.ToString("o") }
        return [string]$value
      }

      $authorUnique = '{{vars.authorUniqueName}}'
      # Azure DevOps OAuth resource ID -- same constant az CLI uses for ADO calls.
      $adoResource = '499b84ac-1321-427f-aa17-267ca6975798'

      # Throws if repos.json is missing/malformed or a configured clone is absent.
      $targets = Get-PrRepoTargets

      # Repository IDs are shared with pr-auto-reviewer via the same 30-day cache
      # file, so whichever orchestration runs first warms it for the other.
      $cacheRoot = Join-Path $env:LOCALAPPDATA 'Orchestra\pr-auto-reviewer'
      if (-not (Test-Path $cacheRoot)) { New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null }
      $cachePath = Join-Path $cacheRoot 'repo-cache.json'
      $cacheMaxAgeDays = 30

      $cacheMap = @{}
      if (Test-Path $cachePath) {
        try {
          $cacheDoc = Get-Content $cachePath -Raw | ConvertFrom-Json
          if ($cacheDoc -and $cacheDoc.PSObject.Properties['entries']) {
            foreach ($prop in $cacheDoc.entries.PSObject.Properties) { $cacheMap[$prop.Name] = $prop.Value }
          } elseif ($cacheDoc -and $cacheDoc.PSObject.Properties['key']) {
            $cacheMap[[string]$cacheDoc.key] = $cacheDoc
          }
        } catch { $cacheMap = @{} }
      }

      function Get-RepositoryId {
        param(
          [Parameter(Mandatory)][string]$OrgUrl,
          [Parameter(Mandatory)][string]$Project,
          [Parameter(Mandatory)][string]$Repository,
          [Parameter(Mandatory)][string]$Resource
        )
        # Route stderr to a temp file rather than merging with 2>&1: az emits
        # `WARNING: Unable to encode the output with cp1252 encoding...` on
        # non-ASCII responses, and that warning would corrupt the JSON parse.
        $repoStderr = [System.IO.Path]::GetTempFileName()
        try {
          $repoRaw = & az rest `
            --method get `
            --uri "$OrgUrl/$Project/_apis/git/repositories/$Repository" `
            --uri-parameters "api-version=7.1-preview.1" `
            --resource $Resource `
            -o json 2>$repoStderr
          if ($LASTEXITCODE -ne 0) {
            $stderr = Get-Content -Raw -LiteralPath $repoStderr -ErrorAction SilentlyContinue
            throw "az rest repository lookup failed for '$Project/$Repository' (exit $LASTEXITCODE). stderr: $stderr"
          }
          $repoObj = (($repoRaw | ForEach-Object { [string]$_ }) -join "`n") | ConvertFrom-Json -Depth 100
        } finally {
          Remove-Item -LiteralPath $repoStderr -ErrorAction SilentlyContinue
        }
        $id = [string]$repoObj.id
        if ([string]::IsNullOrWhiteSpace($id)) { throw "Could not resolve repository ID for '$Project/$Repository'." }
        return $id
      }

      $prs = New-Object System.Collections.Generic.List[object]
      $cacheDirty = $false

      foreach ($target in @($targets)) {
        $organization = $target.organization
        $project = $target.project
        $repository = $target.repository
        $orgUrl = $target.orgUrl
        $cacheKey = "$organization|$project|$repository"

        $repoId = $null
        if ($cacheMap.ContainsKey($cacheKey)) {
          $cached = $cacheMap[$cacheKey]
          try {
            if ($cached -and $cached.repositoryId -and $cached.cachedAt) {
              $cachedAt = [datetime]::Parse([string]$cached.cachedAt)
              if (((Get-Date) - $cachedAt).TotalDays -lt $cacheMaxAgeDays) { $repoId = [string]$cached.repositoryId }
            }
          } catch { $repoId = $null }
        }

        if (-not $repoId) {
          $repoId = Get-RepositoryId -OrgUrl $orgUrl -Project $project -Repository $repository -Resource $adoResource
          $cacheMap[$cacheKey] = [pscustomobject]@{
            key = $cacheKey; repositoryId = $repoId; cachedAt = (Get-Date).ToString('o')
          }
          $cacheDirty = $true
        }

        $listStderr = [System.IO.Path]::GetTempFileName()
        try {
          # '$top' is single-quoted so PowerShell doesn't interpolate $top.
          # --uri-parameters (not --url) so az re-encodes the query: az.cmd
          # dispatches via cmd.exe, which treats a literal `&` as a separator.
          $raw = & az rest `
            --method get `
            --uri "$orgUrl/$project/_apis/git/repositories/$repoId/pullrequests" `
            --uri-parameters "api-version=7.1-preview.1" "searchCriteria.status=active" '$top=200' `
            --resource $adoResource `
            -o json 2>$listStderr
          if ($LASTEXITCODE -ne 0) {
            $stderr = Get-Content -Raw -LiteralPath $listStderr -ErrorAction SilentlyContinue
            throw "az rest pullrequests list failed for '$project/$repository' (exit $LASTEXITCODE). stderr: $stderr"
          }
          $envelope = (($raw | ForEach-Object { [string]$_ }) -join "`n") | ConvertFrom-Json -Depth 100
        } finally {
          Remove-Item -LiteralPath $listStderr -ErrorAction SilentlyContinue
        }

        $allActive = if ($null -ne $envelope.value) { $envelope.value } else { @() }

        # Client-side author filter (case-insensitive on uniqueName). Display
        # name is deliberately not used: Azure DevOps can hold several
        # identities sharing a display name.
        $list = @($allActive | Where-Object {
          $_ -and $_.createdBy -and $_.createdBy.uniqueName -and
          [string]::Equals([string]$_.createdBy.uniqueName, $authorUnique, [StringComparison]::OrdinalIgnoreCase)
        })

        foreach ($p in @($list)) {
          if ($null -eq $p) { continue }

          $reviewerNames = @()
          if ($null -ne $p.reviewers) {
            $reviewerNames = @(@($p.reviewers) | ForEach-Object { [string]$_.displayName } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          }

          $createdByName = ""
          $createdByUnique = ""
          if ($null -ne $p.createdBy) {
            $createdByName = [string]$p.createdBy.displayName
            $createdByUnique = [string]$p.createdBy.uniqueName
          }

          $prId = [int]$p.pullRequestId
          $webUrl = "$($target.prUrlPrefix)$prId"

          $lastCommit = ""
          if ($null -ne $p.lastMergeSourceCommit -and $p.lastMergeSourceCommit.commitId) {
            $lastCommit = [string]$p.lastMergeSourceCommit.commitId
          }

          $isDraftVal = $false
          if ($null -ne $p.isDraft) { $isDraftVal = [bool]$p.isDraft }

          $entry = [ordered]@{
            id = $prId
            title = [string]$p.title
            status = [string]$p.status
            isDraft = $isDraftVal
            createdBy = $createdByName
            createdByUniqueName = $createdByUnique
            creationDate = ConvertTo-IsoUtcString $p.creationDate
            sourceRefName = [string]$p.sourceRefName
            targetRefName = [string]$p.targetRefName
            reviewers = $reviewerNames
            url = $webUrl
            apiUrl = [string]$p.url
            lastMergeSourceCommitId = $lastCommit
            organization = $organization
            project = $project
            repository = $repository
            repoPath = $target.repoPath
          }
          [void]$prs.Add($entry)
        }
      }

      if ($cacheDirty) {
        $entriesObj = [ordered]@{}
        foreach ($k in $cacheMap.Keys) { $entriesObj[$k] = $cacheMap[$k] }
        [pscustomobject]@{ version = 2; entries = [pscustomobject]$entriesObj } |
          ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $cachePath -Encoding utf8
      }

      $prsArr = $prs.ToArray()
      # Emit a JSON array STRING for the downstream dispatch forEach.
      #   * EMPTY    -> literal "[]" (no PRs is a valid no-op).
      #   * 1+ items -> "[{...},...]".
      # Piping an empty array emits NOTHING (consumer gets "" not "[]");
      # -AsArray with -InputObject double-wraps to "[[...]]". Use
      # -InputObject plus an explicit empty-guard.
      if ($prsArr.Length -eq 0) {
        '[]'
      } else {
        ConvertTo-Json -InputObject $prsArr -Depth 100 -Compress
      }

  - name: dispatch-candidates
    type: Orchestration
    dependsOn: [fetch-my-prs]
    orchestration: pr-comment-dispatcher
    forEach: "{{fetch-my-prs.output}}"
    itemParameter: prData
    parameters:
      mode: auto
      forceProcess: "false"
    mode: sync
    maxConcurrency: 5
    continueOnItemFailure: true
    timeoutSeconds: 50000

  - name: aggregate-dispatch
    type: Script
    dependsOn: [dispatch-candidates]
    shell: pwsh
    script: |
      # Deterministic aggregator over the engine forEach rollup. Best-effort
      # classification of each child's finalContent into processed/skipped using
      # a substring search (same heuristic as pr-auto-reviewer's aggregator).
      $ErrorActionPreference = 'Stop'

      $raw = $args[0]
      if ([string]::IsNullOrWhiteSpace($raw)) {
        throw 'dispatch-candidates output is empty.'
      }
      $rollup = ConvertFrom-Json -InputObject $raw -Depth 100 -ErrorAction Stop

      $results = @()
      $processed = 0
      $skipped = 0
      foreach ($r in @($rollup.results)) {
        $prId = $null; $prTitle = $null
        if ($r.input) {
          try {
            $inputObj = if ($r.input -is [string]) { ConvertFrom-Json -InputObject $r.input -Depth 50 } else { $r.input }
            $prId = $inputObj.id
            $prTitle = $inputObj.title
          } catch { }
        }

        $classification = $r.status
        if ($r.status -eq 'succeeded' -and $r.finalContent) {
          $fc = ([string]$r.finalContent).ToLowerInvariant()
          if ($fc.Contains('"status":"skipped"') -or ($fc.Contains('skipped') -and -not $fc.Contains('processed'))) {
            $classification = 'skipped'; $skipped++
          } else {
            $classification = 'processed'; $processed++
          }
        }

        $results += [pscustomobject]@{
          prId        = $prId
          prTitle     = $prTitle
          executionId = $r.executionId
          status      = $classification
          summary     = if ($r.finalContent) { [string]$r.finalContent } else { '' }
          error       = $r.errorMessage
        }
      }

      [pscustomobject]@{
        totalPRsDispatched = [int]$rollup.totalDispatched
        succeeded          = [int]$rollup.succeeded
        failed             = [int]$rollup.failed
        processed          = $processed
        skipped            = $skipped
        results            = $results
      } | ConvertTo-Json -Depth 50 -Compress
    arguments:
      - "{{dispatch-candidates.output}}"
    timeoutSeconds: 120

  - name: gate-noteworthy-activity
    type: Prompt
    dependsOn: [aggregate-dispatch]
    systemPrompt: |
      You are a noise filter for the PR comment tracker. Your only job is to decide whether this scheduled run produced anything worth surfacing to the user via ActionView.

      Read the dispatcher summary JSON. The run is "noteworthy" only if at least one PR was actually processed by the dispatcher (`processed > 0`) OR at least one dispatch failed (`failed > 0`). Both signal real activity that warrants a notification.

      If the run is NOT noteworthy (every PR was skipped — no new unaddressed reviewer comments, no failures, nothing interesting), call orchestra_complete with status 'success' and a reason like 'All <totalPRsDispatched> PR(s) were skipped by the dispatcher (no new unaddressed comments, no failures). Skipping ActionView entry creation for this uneventful run.'. This stops the orchestration cleanly so no ActionView entry is created or submitted.

      If the run IS noteworthy, output the dispatcher summary JSON unchanged (no prose, no markdown, no fences) so the downstream ActionView generator can consume it.

      Do not call any other tools. Do not write commentary in either branch.
    userPrompt: |
      Decide whether this PR comment tracker run is noteworthy enough to surface in ActionView.

      Dispatcher summary:
      {{aggregate-dispatch.output}}

  - name: create-action-view-entry
    type: Prompt
    dependsOn: [gate-noteworthy-activity, fetch-my-prs]
    systemPrompt: |
      You are an ActionView entry generator for PR comment tracking runs. You create structured JSON entries. The entry type must be 'pr-comment-tracker-run' and source must be '{{orchestration.name}}'.

      Your entries should give the user a clear overview of what the comment tracker discovered and dispatched through the shared dispatcher: how many PRs were found, how many were skipped vs processed, and the outcomes.

      IMPORTANT: Save the generated JSON entry using the orchestra_save_file tool. Output ONLY the raw JSON -- it will be validated and submitted by a downstream step.
    userPrompt: |
      Create an ActionView entry summarizing this PR comment tracking run.

      PR candidates:
      {{fetch-my-prs.output}}

      Dispatcher results:
      {{gate-noteworthy-activity.output}}

      Create an entry with:
      1. type: 'pr-comment-tracker-run'
      2. source: '{{orchestration.name}}'
      3. title: 'PR Comment Tracker Run' with count of PRs dispatched
      4. subtitle: Summary like 'X dispatched, Y processed, Z skipped, W failed'
      5. severity: 'high' if any processing failed, 'medium' if PRs were processed, 'low' if all skipped
      6. tags: ['pr-response', 'comment-tracker', 'ZTS']
      7. content blocks: include an alert block if any dispatch failed, a summary table (PR ID | Title | Action | Outcome), a Dispatcher Results section, a Skipped PRs section if any were skipped, and a Failed Dispatches section if any failed.
      8. actions: include 'View PRs' (primary) and 'Dismiss' (default)

      Save the JSON using orchestra_save_file. Output ONLY the raw JSON.

  - name: submit-action-view-entry
    type: Orchestration
    dependsOn: [create-action-view-entry]
    orchestration: actionview-submit
    parameters:
      entryJson: "{{create-action-view-entry.output}}"
    mode: sync
    timeoutSeconds: 600

  - name: generate-summary
    type: Prompt
    dependsOn: [aggregate-dispatch, fetch-my-prs, submit-action-view-entry]
    systemPrompt: |
      You are a reporting assistant. Produce a clear, concise markdown summary of the PR comment tracking orchestration run.
    userPrompt: |
      Create a final markdown summary of this PR comment tracking run.

      PR candidates:
      {{fetch-my-prs.output}}

      Dispatcher results:
      {{aggregate-dispatch.output}}

      ActionView submission:
      {{submit-action-view-entry.output}}

      Produce a polished markdown report:
      1. Header: '## PR Comment Tracker Summary' with orchestration run info
      2. How many PRs were found that I created
      3. How many were dispatched and their outcomes (processed, skipped, failed)
      4. Any dispatcher/response failures
      5. Confirmation that ActionView entry was submitted
      6. Any errors or issues encountered during the run

trigger:
  type: scheduler
  enabled: true
  intervalSeconds: 3600
