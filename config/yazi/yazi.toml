#:schema https://yazi-rs.github.io/schemas/yazi.json

# Keep preferences here; inherit openers, MIME detection, preview plugins,
# and task settings from the installed Yazi release.
# The built-in Windows openers use VS Code and the OS-associated media player.

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_dir_first = true
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]

[preview]
wrap     = "no"
tab_size = 2
