#:schema https://yazi-rs.github.io/schemas/keymap.json

# Extend the current defaults so command renames and new bindings are inherited.
[mgr]
prepend_keymap = [
	# Keep the existing zoxide/fzf shortcuts.
	{ on = "z", run = "plugin zoxide", desc = "Jump to a directory via zoxide" },
	{ on = "Z", run = "plugin fzf",    desc = "Jump to a file/directory via fzf" },

	# Keep single-key tab creation; T replaces the default t,r rename chord.
	{ on = "t", run = "tab_create --current",     desc = "Create a new tab in CWD" },
	{ on = "T", run = "tab_rename --interactive", desc = "Rename current tab" },
]
